name: Título do PR

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # O merge é por squash: o título do PR vira a mensagem do commit na main.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            perf
            style
            build
            ci
            chore
          requireScope: false
          # Descrição em português, começando com minúscula (AGENTS.md).
          subjectPattern: ^[a-zà-ú].+[^.]$
          subjectPatternError: |
            A descrição "{subject}" deve começar com letra minúscula e não terminar com ponto.
