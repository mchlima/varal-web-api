# Atualizações de dependências agrupadas, uma vez por semana (plano de desenvolvimento, seção 2.4).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Prisma fixo em 7.10.0 até decisão registrada no plano (o 8 ainda é RC).
      - dependency-name: prisma
        versions: ['>=8.0.0-0']
      - dependency-name: '@prisma/*'
        versions: ['>=8.0.0-0']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
